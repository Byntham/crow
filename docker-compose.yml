services:
  crow:
    build:
      context: .
      args:
        CROW_CLI_PACKAGE: ${CROW_CLI_PACKAGE:-@openai/codex}
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8787}:${PORT:-8787}"
    volumes:
      - crow-state:/app/.crow-data
      # Authenticate once with the commands in README so credentials stay in
      # these named volumes. Claude's config and subscription credentials are
      # redirected into the mounted .claude volume via CLAUDE_CONFIG_DIR.
      - crow-codex-auth:/home/node/.codex
      - crow-claude-auth:/home/node/.claude
    environment:
      # Keep the container's listener in sync with the published port when
      # PORT is supplied by the shell or .env. Without this explicit entry,
      # Compose interpolation could publish one port while env_file leaves
      # the app listening on another.
      PORT: "${PORT:-8787}"
      # Keep a provider selected on the Compose command line (for example,
      # CROW_PROVIDER=claude docker compose up) in sync with the CLI image
      # selected by the build argument above.
      CROW_PROVIDER: "${CROW_PROVIDER:-codex}"
      # The host-side paths below are only for Compose's secret sources.
      # Inside the container the app always reads the mounted secret files.
      GITHUB_PRIVATE_KEY_FILE: /run/secrets/github_private_key
      GITHUB_WEBHOOK_SECRET_FILE: /run/secrets/github_webhook_secret
      # Docker forwards the published port to the container interface, so the
      # process must listen on all container interfaces (the host port remains
      # bound to 127.0.0.1 above).
      CROW_BIND_HOST: 0.0.0.0
      # Keep Claude's config/credentials under the persistent volume mounted
      # at /home/node/.claude instead of the service user's default home.
      CLAUDE_CONFIG_DIR: /home/node/.claude
    secrets:
      - github_private_key
      - github_webhook_secret
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 8787) + '/health').then(async r=>{const b=await r.json();process.exit(r.ok && b.configured ? 0 : 1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3

secrets:
  github_private_key:
    file: ${GITHUB_PRIVATE_KEY_PATH:-./secrets/github-app.pem}
  github_webhook_secret:
    file: ${GITHUB_WEBHOOK_SECRET_PATH:-./secrets/webhook-secret}

volumes:
  crow-state:
  crow-codex-auth:
  crow-claude-auth:
