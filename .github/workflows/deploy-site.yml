name: Deploy Crow installation website

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type deploy birdapp.dev to publish the selected workflow revision
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: crow-installation-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: public-website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - name: Build reviewed maintenance tool
        run: cargo build --locked --release --bin crow-maint
      - name: Check confirmation and existing public release
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: target/release/crow-maint stage-site website
      - name: Deploy selected source to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CROW_PAGES_API_TOKEN }}
          DEPLOY_COMMIT: ${{ github.workflow_sha }}
        run: npx --yes wrangler@4.72.0 pages deploy website --project-name crow-site --branch main --commit-hash "$DEPLOY_COMMIT"
