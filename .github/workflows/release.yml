name: Build Crow binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e 'import fs from "node:fs"; const pkg=JSON.parse(fs.readFileSync("package.json")); if (process.env.RELEASE_TAG !== `v${pkg.version}`) throw new Error("Tag must match package.json version");'
      - name: Install pinned pnpm
        run: npm install --global "$(node --print 'JSON.parse(require("node:fs").readFileSync("package.json")).packageManager')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build:binary
      - name: Test packaged executable without host Node
        run: |
          mkdir binary-smoke
          tar -xzf dist-release/crow-v*-linux-${{ matrix.arch }}.tar.gz -C binary-smoke
          CROW_TEST_BINARY="$PWD/binary-smoke/crow" node --test test/binary.test.mjs
          (cd dist-release && sha256sum --check SHA256SUMS)
      - name: Record artifact source and executable version
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          const { version } = JSON.parse(readFileSync("package.json"));
          const arch = process.env.BUILD_ARCH;
          const archive = `crow-v${version}-linux-${arch}.tar.gz`;
          const executableVersion = execFileSync("./binary-smoke/crow", ["--version"], { encoding: "utf8" }).trim();
          if (executableVersion !== version) throw new Error("Packaged executable version mismatch");
          const sha256 = createHash("sha256").update(readFileSync(`dist-release/${archive}`)).digest("hex");
          writeFileSync("dist-release/build-metadata.json", JSON.stringify({ version, executableVersion, arch, archive, sha256, commit: process.env.GITHUB_SHA }) + "\n");
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crow-linux-${{ matrix.arch }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7
