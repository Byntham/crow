name: Build Crow binaries

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Rust warnings
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test native implementation
        run: cargo test --locked --all-targets
      - name: Build and package native executable
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then unset RELEASE_TAG; fi
          scripts/build-release.sh
      - name: Test packaged executable without development tools
        run: |
          mkdir binary-smoke
          tar -xzf dist-release/crow-v*-linux-${{ matrix.arch }}.tar.gz -C binary-smoke
          scripts/smoke-release.sh "$PWD/binary-smoke/crow"
          (cd dist-release && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crow-linux-${{ matrix.arch }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7
