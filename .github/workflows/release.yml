name: Build Crow binaries

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Rust warnings
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test native implementation
        run: cargo test --locked --all-targets
      - name: Test historical replay utilities
        run: python3 -m unittest discover -s examples/historical_reviews -p 'test_*.py'
      - name: Test real rootless runtime experiments
        if: matrix.arch == 'x64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman uidmap
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          podman pull docker.io/library/alpine:3.22
          crow_image_id=$(podman image inspect --format '{{.Id}}' docker.io/library/alpine:3.22)
          export CROW_TEST_IMAGE="sha256:${crow_image_id#sha256:}"
          systemd-run --user --scope -p Delegate=yes -- cargo test --locked --test execution_mcp -- --ignored --nocapture --test-threads=1
          systemd-run --user --scope -p Delegate=yes -- cargo test --locked --test autonomous_runtime -- --ignored --nocapture --test-threads=1
          systemd-run --user --scope -p Delegate=yes -- cargo test --locked --test discovery_runtime -- --ignored --nocapture --test-threads=1
          systemd-run --user --scope -p Delegate=yes -- cargo test --locked --lib real_podman_cleanup -- --ignored --nocapture --test-threads=1
      - name: Install native musl compiler
        run: sudo apt-get update && sudo apt-get install --yes musl-tools binutils
      - name: Build and package portable native executable
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then unset RELEASE_TAG; fi
          scripts/build-release.sh
      - name: Test packaged executable without development tools
        run: |
          mkdir binary-smoke
          tar -xzf dist-release/crow-v*-linux-${{ matrix.arch }}.tar.gz -C binary-smoke
          scripts/check-release-compatibility.sh "$PWD/binary-smoke/crow"
          scripts/smoke-release.sh "$PWD/binary-smoke/crow"
          (cd dist-release && sha256sum --check SHA256SUMS)
      - name: Run packaged executable without a system libc or loader
        run: |
          crow_root=$(mktemp -d)
          trap 'rm -rf -- "$crow_root"' EXIT
          cp binary-smoke/crow "$crow_root/crow"
          crow_expected=$("$crow_root/crow" --version)
          crow_chroot=$(command -v chroot)
          crow_actual=$(sudo -n env -i "$crow_chroot" "$crow_root" /crow --version)
          test "$crow_actual" = "$crow_expected"
          sudo -n env -i "$crow_chroot" "$crow_root" /crow help >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crow-linux-${{ matrix.arch }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7
