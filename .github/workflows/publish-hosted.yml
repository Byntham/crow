name: Publish hosted Crow binaries

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build Crow binaries run ID
        type: string
        required: true
      build_commit:
        description: Exact full 40-character source commit SHA from that run
        type: string
        required: true
      version:
        description: Stable version from Cargo.toml, without v
        type: string
        required: true
      confirmation:
        description: Type publish VERSION to make these binaries public
        type: string
        required: true

permissions:
  contents: read
  actions: read

# Never cancel an upload midway through changing the latest version.
concurrency:
  group: crow-public-release
  cancel-in-progress: false

env:
  BUILD_RUN_ID: ${{ inputs.build_run_id }}
  BUILD_COMMIT: ${{ inputs.build_commit }}
  RELEASE_VERSION: ${{ inputs.version }}
  PUBLICATION_CONFIRMATION: ${{ inputs.confirmation }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: public-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Run publication code from the manually selected workflow revision,
          # never from an arbitrary downloaded artifact or build branch.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Build reviewed maintenance tool
        run: cargo build --locked --release --bin crow-maint
      - name: Verify selected build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: target/release/crow-maint verify-run
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: crow-linux-*
          path: artifacts
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Validate, publish and verify public downloads
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CROW_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CROW_R2_SECRET_ACCESS_KEY }}
          CROW_R2_BUCKET: crow-releases
        run: target/release/crow-maint publish artifacts
