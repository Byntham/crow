name: Prepare Crow Pages project

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type create crow-site to prepare the empty Pages project
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: crow-installation-website
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    environment: public-website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Build reviewed maintenance tool
        run: cargo build --locked --release --bin crow-maint
      - name: Create or verify the empty direct-upload project
        env:
          PREPARE_CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CROW_PAGES_API_TOKEN }}
        run: target/release/crow-maint prepare-site
